# Render.com "Blueprint": New + -> Blueprint -> pick this repository. Creates the app AND a Postgres database.
services:
  - type: web
    name: ledgerline
    runtime: docker
    plan: starter
    healthCheckPath: /_stcore/health
    envVars:
      - key: LEDGERLINE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
databases:
  - name: ledgerline-db
    plan: basic-256mb
